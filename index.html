<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Call Summary Review</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Call summary review</h1>
      <p class="sub">Check each summary against its transcript. You make the decision; the tool records your evidence.</p>
    </div>
    <div class="top-actions">
      <span id="progress" class="progress" aria-live="polite"></span>
      <span id="saveState" class="save-state" aria-live="polite"></span>
      <button id="exportBtn" type="button">Export JSON</button>
      <button id="resetBtn" type="button" class="danger">Reset all</button>
    </div>
  </header>

  <div class="layout">
    <nav class="call-list" aria-label="Calls">
      <div class="list-controls">
        <label class="sort-label" for="searchBox">Search</label>
        <input id="searchBox" class="search-box" type="search" placeholder="Call ID or any word, e.g. 019 or StepChange" autocomplete="off">
        <div id="filterBar" class="filter-bar" role="group" aria-label="Filter calls by status"></div>
        <label class="sort-label" for="sortSel">Sort by</label>
        <select id="sortSel">
          <option value="id">Call ID</option>
          <option value="priority">Priority score (highest first)</option>
        </select>
      </div>
      <ul id="callList"></ul>
    </nav>
    <main id="main" class="main"></main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
